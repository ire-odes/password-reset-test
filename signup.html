<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - AirFlow IQ</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
        }
        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #E0E0E0;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border: 2px solid #007BFF;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        #message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .info {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        /* OTP Input Styles */
        #verificationSection {
            display: none;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .otp-container {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .otp-input {
            width: 50px;
            height: 55px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border: 2px solid #E0E0E0;
            border-radius: 8px;
            margin: 0;
        }
        .otp-input:focus {
            border-color: #007BFF;
        }
        .resend-link {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
        }
        .resend-link a {
            color: #007BFF;
            text-decoration: none;
            cursor: pointer;
        }
        .resend-link a:hover {
            text-decoration: underline;
        }
        #signupSection, #verificationSection {
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Create Account</h2>
    
    <!-- Step 1: Sign Up Form -->
    <div id="signupSection">
        <p>Sign up to get started with AirFlow IQ</p>
        <input type="email" id="email" placeholder="Email address" />
        <input type="password" id="password" placeholder="Password (min 6 characters)" />
        <input type="text" id="fullName" placeholder="Full Name (optional)" />
        <button onclick="signUp()">Create Account</button>
    </div>

    <!-- Step 2: Verification Code Input -->
    <div id="verificationSection">
        <p>We've sent a 6-digit code to<br><strong id="userEmail"></strong></p>
        <p style="font-size: 12px; color: #9ca3af;">Enter the code below to verify your account</p>
        
        <div class="otp-container">
            <input type="text" maxlength="1" class="otp-input" id="otp1" oninput="moveToNext(this, 'otp2')" onkeydown="handleBackspace(event, this, null)">
            <input type="text" maxlength="1" class="otp-input" id="otp2" oninput="moveToNext(this, 'otp3')" onkeydown="handleBackspace(event, this, 'otp1')">
            <input type="text" maxlength="1" class="otp-input" id="otp3" oninput="moveToNext(this, 'otp4')" onkeydown="handleBackspace(event, this, 'otp2')">
            <input type="text" maxlength="1" class="otp-input" id="otp4" oninput="moveToNext(this, 'otp5')" onkeydown="handleBackspace(event, this, 'otp3')">
            <input type="text" maxlength="1" class="otp-input" id="otp5" oninput="moveToNext(this, 'otp6')" onkeydown="handleBackspace(event, this, 'otp4')">
            <input type="text" maxlength="1" class="otp-input" id="otp6" oninput="verifyCodeAuto()" onkeydown="handleBackspace(event, this, 'otp5')">
        </div>

        <button onclick="verifyCode()">Verify Code</button>
        
        <div class="resend-link">
            Didn't receive the code? <a onclick="resendCode()">Resend</a>
        </div>
    </div>

    <div id="message"></div>
</div>

<script>
const SUPABASE_URL = 'https://hniplnaohvcbtmelatnz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhuaXBsbmFvaHZjYnRtZWxhdG56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1Nzk0MjAsImV4cCI6MjA4MDE1NTQyMH0.g7sgeZBW0RKkMI1lryA96Sym6cnejUAcmIx_npGr1Ko';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const messageDiv = document.getElementById('message');

let userEmail = '';
let userPassword = '';

function showMessage(text, type) {
    messageDiv.textContent = text;
    messageDiv.className = type;
    messageDiv.style.display = 'block';
}

function hideMessage() {
    messageDiv.style.display = 'none';
}

// OTP Input Navigation
function moveToNext(current, nextFieldId) {
    if (current.value.length === 1 && nextFieldId) {
        document.getElementById(nextFieldId).focus();
    }
}

function handleBackspace(event, current, prevFieldId) {
    if (event.key === 'Backspace' && current.value.length === 0 && prevFieldId) {
        document.getElementById(prevFieldId).focus();
    }
}

function getOTPCode() {
    let code = '';
    for (let i = 1; i <= 6; i++) {
        code += document.getElementById(`otp${i}`).value;
    }
    return code;
}

function clearOTPInputs() {
    for (let i = 1; i <= 6; i++) {
        document.getElementById(`otp${i}`).value = '';
    }
    document.getElementById('otp1').focus();
}

async function verifyCodeAuto() {
    const code = getOTPCode();
    if (code.length === 6) {
        // Auto-verify when all 6 digits are entered
        await verifyCode();
    }
}

async function signUp() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const fullName = document.getElementById('fullName').value.trim();
    const button = document.querySelector('#signupSection button');

    // Validation
    if (!email || !password) {
        showMessage('Please fill in email and password', 'error');
        return;
    }

    if (!email.includes('@') || !email.includes('.')) {
        showMessage('Please enter a valid email address', 'error');
        return;
    }

    if (password.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
    }

    // Store for later use
    userEmail = email;
    userPassword = password;

    // Disable button and show loading
    button.disabled = true;
    button.textContent = 'Creating account...';
    showMessage('Sending verification code to your email...', 'loading');

    try {
        // Sign up with Supabase
        const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
                data: {
                    full_name: fullName || email.split('@')[0]
                },
                emailRedirectTo: window.location.origin + '/confirmed.html'
            }
        });

        if (error) {
            throw error;
        }

        // Success - show verification section
        showMessage('Verification code sent! Check your email.', 'success');
        
        // Switch to verification view
        setTimeout(() => {
            document.getElementById('signupSection').style.display = 'none';
            document.getElementById('verificationSection').style.display = 'block';
            document.getElementById('userEmail').textContent = email;
            document.getElementById('otp1').focus();
            hideMessage();
        }, 1500);

    } catch (error) {
        console.error('Signup error:', error);
        
        if (error.message.includes('already registered')) {
            showMessage('This email is already registered. Please log in instead.', 'error');
        } else {
            showMessage('Error: ' + error.message, 'error');
        }
        
        button.disabled = false;
        button.textContent = 'Create Account';
    }
}

async function verifyCode() {
    const code = getOTPCode();
    const button = document.querySelector('#verificationSection button');

    if (code.length !== 6) {
        showMessage('Please enter the complete 6-digit code', 'error');
        return;
    }

    // Disable button and show loading
    button.disabled = true;
    button.textContent = 'Verifying...';
    showMessage('Verifying your code...', 'loading');

    try {
        // Verify OTP with Supabase
        const { data, error } = await supabaseClient.auth.verifyOtp({
            email: userEmail,
            token: code,
            type: 'signup'
        });

        if (error) {
            throw error;
        }

        // Success!
        showMessage('✓ Account verified successfully! You can now log in to AirFlow IQ.', 'success');
        
        // Clear the form
        setTimeout(() => {
            document.getElementById('signupSection').style.display = 'block';
            document.getElementById('verificationSection').style.display = 'none';
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('fullName').value = '';
            clearOTPInputs();
            
            showMessage('✓ Account created! You can close this page and log in to the app.', 'success');
        }, 2000);

    } catch (error) {
        console.error('Verification error:', error);
        
        if (error.message.includes('expired')) {
            showMessage('Code expired. Please request a new one.', 'error');
        } else if (error.message.includes('invalid')) {
            showMessage('Invalid code. Please check and try again.', 'error');
        } else {
            showMessage('Error: ' + error.message, 'error');
        }
        
        clearOTPInputs();
        button.disabled = false;
        button.textContent = 'Verify Code';
    }
}

async function resendCode() {
    showMessage('Sending new verification code...', 'loading');

    try {
        // Resend verification code
        const { data, error } = await supabaseClient.auth.resend({
            type: 'signup',
            email: userEmail
        });

        if (error) {
            throw error;
        }

        showMessage('New code sent! Check your email.', 'success');
        clearOTPInputs();

    } catch (error) {
        console.error('Resend error:', error);
        showMessage('Error resending code: ' + error.message, 'error');
    }
}

// Allow pasting 6-digit codes
document.addEventListener('paste', (e) => {
    if (document.getElementById('verificationSection').style.display === 'block') {
        const paste = e.clipboardData.getData('text');
        if (/^\d{6}$/.test(paste)) {
            e.preventDefault();
            for (let i = 0; i < 6; i++) {
                document.getElementById(`otp${i + 1}`).value = paste[i];
            }
            verifyCodeAuto();
        }
    }
});
</script>
</body>
</html>
